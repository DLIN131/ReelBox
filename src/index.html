<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src * data: blob:; media-src * file: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src https://api.github.com" />
    <title>ReelBox</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand" data-nav="home">Reel<span>Box</span></div>
      <button id="version" class="version" title="更新紀錄"></button>
      <nav class="tabs">
        <button data-nav="home" class="active">首頁</button>
        <button data-nav="categories">分類</button>
        <button data-nav="models">作者</button>
        <button data-nav="favorites">收藏</button>
        <button data-nav="history">紀錄</button>
        <button data-nav="downloads">下載<span id="dlCount" class="dl-count hidden"></span></button>
        <button data-nav="settings">設定</button>
      </nav>
      <form class="search" id="searchForm">
        <input id="searchInput" type="search" placeholder="搜尋影片、標籤、作者，或貼上影片網址" autocomplete="off" />
        <button type="submit">搜尋</button>
      </form>
    </header>
    <main id="view"></main>

    <div id="player" class="player hidden"></div>
    <div id="overlay" class="overlay hidden"></div>
    <div id="toast" class="toast hidden"></div>

    <script src="version.js"></script>
    <script type="module" src="app.js"></script>
  </body>
</html>
