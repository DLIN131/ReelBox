<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src * data: blob:; media-src * file: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src https://api.github.com" />
    <title>ReelBox</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">Reel<span>Box</span></div>
      <button id="version" class="version" title="更新紀錄"></button>
      <div class="site-switch" id="siteSwitch" title="切換來源"></div>
      <nav class="tabs" id="tabs"></nav>
      <form class="search" id="searchForm">
        <input id="searchInput" type="search" placeholder="搜尋目前來源，或貼上影片網址" autocomplete="off" />
        <button type="submit">搜尋</button>
      </form>
    </header>
    <main id="view"></main>

    <div id="player" class="player hidden"></div>
    <div id="overlay" class="overlay hidden"></div>
    <div id="toast" class="toast hidden"></div>

    <script src="version.js"></script>
    <script type="module" src="app.js"></script>
  </body>
</html>
